name: Daily GitHub Trending to Feishu

on:
  schedule:
    # Run at 09:00 Beijing Time (01:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  push-trending:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests openai
      
      - name: Fetch GitHub Trending
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_trending.py > trending.json 2>fetch.log
          cat trending.json
          test -s trending.json || (cat fetch.log && exit 1)
      
      - name: Summarize with SiliconFlow
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          python scripts/summarize.py trending.json > trending_summary.json
          cat trending_summary.json
      
      - name: Send to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python scripts/feishu_bot.py trending_summary.json
